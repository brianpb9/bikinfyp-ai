name: Managed mobile staging evidence

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/managed-mobile-evidence.yml
      - scripts/build-mobile-evidence-image.sh
      - scripts/run-mobile-evidence-image.sh
      - scripts/verify-mobile-evidence-receipt.mjs
      - tests/managed-mobile-ci-workflow.test.ts
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Exact 40-character Reviewer-approved staging bundle SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: managed-mobile-staging-evidence
  cancel-in-progress: false

jobs:
  exact-sha-mobile-evidence:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # A PR cannot supply workflow_dispatch inputs. This bounded activation
      # path is intentionally pinned to the already reviewed staging bundle.
      REVIEWED_SHA: ${{ github.event_name == 'pull_request' && 'acf1fd49fadc3387c3ae6a13f711689f1e0d9397' || inputs.reviewed_sha }}
    steps:
      - name: Checkout reviewed CI control code
        uses: actions/checkout@v4
        with:
          path: control
          fetch-depth: 0
          persist-credentials: false

      - name: Validate explicit reviewed SHA and control lineage
        working-directory: control
        run: |
          set -euo pipefail
          [[ "$REVIEWED_SHA" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$REVIEWED_SHA^{commit}"
          git merge-base --is-ancestor "$REVIEWED_SHA" HEAD

      - name: Detached checkout of exact reviewed bundle
        uses: actions/checkout@v4
        with:
          ref: ${{ env.REVIEWED_SHA }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Prove detached exact commit and clean tree
        working-directory: source
        run: |
          set -euo pipefail
          git checkout --detach "$REVIEWED_SHA"
          test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"
          test "$(git cat-file -t "$REVIEWED_SHA")" = commit
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Build immutable exact-source evidence image
        working-directory: source
        env:
          EXPECTED_APP_SHA: ${{ env.REVIEWED_SHA }}
          EVIDENCE_IMAGE_TAG: managed-mobile-evidence:${{ env.REVIEWED_SHA }}
        run: EVIDENCE_BUILD_OUTPUT_FILE="$GITHUB_ENV" bash ../control/scripts/build-mobile-evidence-image.sh

      - name: Independently verify OCI revision and tree labels
        working-directory: source
        run: |
          set -euo pipefail
          expected_tree="$(git rev-parse 'HEAD^{tree}')"
          test "$EVIDENCE_SOURCE_SHA" = "$REVIEWED_SHA"
          test "$EVIDENCE_SOURCE_TREE" = "$expected_tree"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$EVIDENCE_IMAGE_DIGEST")" = "$REVIEWED_SHA"
          test "$(docker image inspect --format '{{index .Config.Labels "ai.hdrv.source.tree"}}' "$EVIDENCE_IMAGE_DIGEST")" = "$expected_tree"

      - name: Run provider-free staging evidence with managed secret injection
        env:
          EXPECTED_APP_SHA: ${{ env.REVIEWED_SHA }}
          EVIDENCE_INHERIT_STAGING_ENV: "1"
          EVIDENCE_RECEIPT_EXPORT_DIR: ${{ runner.temp }}/managed-mobile-receipts
          BASE: https://racun-ai-staging-web.onrender.com
          RACUN_DEPLOY_ENV: staging
          RACUN_DB_RUNTIME: postgres
          STORAGE_MODE: r2
          R2_REGION: auto
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.STAGING_AUTH_SECRET }}
          R2_ENDPOINT: ${{ secrets.STAGING_R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.STAGING_R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.STAGING_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.STAGING_R2_SECRET_ACCESS_KEY }}
        run: bash control/scripts/run-mobile-evidence-image.sh

      - name: Fail closed on unsanitized or stale receipts
        run: node control/scripts/verify-mobile-evidence-receipt.mjs "$RUNNER_TEMP/managed-mobile-receipts" "$REVIEWED_SHA"

      - name: Upload sanitized immutable receipt bundle
        uses: actions/upload-artifact@v4
        with:
          name: managed-mobile-${{ env.REVIEWED_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/managed-mobile-receipts
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
