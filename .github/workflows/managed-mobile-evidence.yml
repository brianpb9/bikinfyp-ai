name: Managed mobile staging evidence

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/managed-mobile-evidence.yml
      - scripts/build-mobile-evidence-image.sh
      - scripts/managed-staging-db-tls-window.mjs
      - scripts/preflight-staging-r2.mjs
      - scripts/run-staging-database-tls-preflight.mjs
      - scripts/run-mobile-evidence-image.sh
      - scripts/verify-staging-app-health.mjs
      - scripts/validate-staging-database-secret-contract.mjs
      - scripts/verify-mobile-evidence-receipt.mjs
      - scripts/acquire-normal-representative-metadata.mjs
      - scripts/verify-normal-representative-metadata-receipt.mjs
      - tests/managed-mobile-ci-workflow.test.ts
      - tests/managed-runner-sha-binding.test.ts
      - tests/staging-app-health-preflight.test.ts
      - tests/staging-db-secret-contract.test.ts
      - tests/staging-db-tls-preflight-only.test.ts
      - tests/staging-db-tls-window.test.ts
      - tests/staging-r2-preflight.test.ts
      - tests/normal-representative-metadata-acquisition.test.mjs
  workflow_dispatch:
    inputs:
      mode:
        description: Safe staging database operation to run
        required: true
        default: secret-contract
        type: choice
        options:
          - secret-contract
          - tls-preflight-only
          - representative-metadata-readonly
          - full-e2e
      reviewed_sha:
        description: Exact 40-character deployed staging app SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: managed-mobile-staging-evidence
  cancel-in-progress: false

jobs:
  # A PR may only prove that the control change is internally valid. It never
  # receives an Environment and never executes a secret-bearing container.
  pr-static-validation:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout untrusted PR control code (secret-free)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve exact reviewed bundle without secrets
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 9ba6330e394900c6c818be2021dcb8cc5a1b6d7b
          path: reviewed-bundle
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: /Dockerfile.mobile-evidence
          sparse-checkout-cone-mode: false

      - name: Prove reviewed bundle binding
        working-directory: reviewed-bundle
        env:
          REVIEWED_RUNNER_SHA: 9ba6330e394900c6c818be2021dcb8cc5a1b6d7b
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REVIEWED_RUNNER_SHA"
          printf '%s\n' "$REVIEWED_RUNNER_SHA" | grep -Eq '^[0-9a-f]{40}$'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: bash -n scripts/build-mobile-evidence-image.sh scripts/run-mobile-evidence-image.sh && node --check scripts/preflight-staging-r2.mjs scripts/managed-staging-db-tls-window.mjs scripts/run-staging-database-tls-preflight.mjs scripts/validate-staging-database-secret-contract.mjs scripts/verify-staging-app-health.mjs scripts/acquire-normal-representative-metadata.mjs scripts/verify-normal-representative-metadata-receipt.mjs
      - run: npx tsc --noEmit
      - run: npx tsx --test tests/managed-mobile-ci-workflow.test.ts tests/managed-runner-sha-binding.test.ts tests/staging-app-health-preflight.test.ts tests/staging-r2-preflight.test.ts tests/staging-db-tls-window.test.ts tests/staging-db-secret-contract.test.ts tests/staging-db-tls-preflight-only.test.ts tests/normal-representative-metadata-acquisition.test.mjs

  staging-database-secret-contract:
    # This mode receives only the database URL and non-secret expected user.
    # It never receives the Render token and cannot open an allow-list window.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode == 'secret-contract'
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout immutable default-branch contract validator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 1
          persist-credentials: false

      - name: Validate staging database secret contract without network access
        working-directory: control
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_DATABASE_EXPECTED_USER: ${{ vars.STAGING_DATABASE_EXPECTED_USER }}
        run: node scripts/validate-staging-database-secret-contract.mjs

  staging-database-tls-preflight:
    # This mode proves the reviewed TLS/principal control and cleans up, but
    # cannot execute the managed mobile E2E runner.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode == 'tls-preflight-only'
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout immutable default-branch control code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pinned Node runtime for trusted preflight control
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: control/package-lock.json

      - name: Install locked trusted preflight dependencies without lifecycle scripts
        working-directory: control
        run: npm ci --ignore-scripts

      - name: Run temporary staging database TLS preflight only
        id: staging_db_tls_preflight
        env:
          STAGING_RENDER_POSTGRES_ID: dpg-d9n21fnlk1mc73djm8q0-a
          STAGING_RENDER_API_KEY: ${{ secrets.STAGING_RENDER_API_KEY }}
          STAGING_DATABASE_EXPECTED_USER: ${{ vars.STAGING_DATABASE_EXPECTED_USER }}
          MANAGED_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: node control/scripts/run-staging-database-tls-preflight.mjs

      - name: Always close temporary staging database TLS preflight window
        if: always() && steps.staging_db_tls_preflight.outcome != 'skipped'
        env:
          STAGING_RENDER_POSTGRES_ID: dpg-d9n21fnlk1mc73djm8q0-a
          STAGING_RENDER_API_KEY: ${{ secrets.STAGING_RENDER_API_KEY }}
        run: node control/scripts/managed-staging-db-tls-window.mjs close

  representative-metadata-readonly:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode == 'representative-metadata-readonly'
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_APP_SHA: acf1fd49fadc3387c3ae6a13f711689f1e0d9397
    steps:
      - name: Checkout immutable default-branch control code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 1
          persist-credentials: false

      - name: Bind dispatch to exact staging app and control
        working-directory: control
        env:
          REQUESTED_SHA: ${{ inputs.reviewed_sha }}
          CONTROL_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$REQUESTED_SHA" = "$EXPECTED_APP_SHA"
          test "$(git rev-parse HEAD)" = "$CONTROL_SHA"

      - name: Verify public staging app identity and safety
        working-directory: control
        run: node scripts/verify-staging-app-health.mjs

      - name: Validate staging database secret contract before network access
        working-directory: control
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_DATABASE_EXPECTED_USER: ${{ vars.STAGING_DATABASE_EXPECTED_USER }}
        run: node scripts/validate-staging-database-secret-contract.mjs

      - name: Set up pinned Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: control/package-lock.json

      - name: Install locked control dependencies without lifecycle scripts
        working-directory: control
        run: npm ci --ignore-scripts

      - name: Acquire one immutable metadata packet read-only
        id: metadata_acquisition
        working-directory: control
        env:
          STAGING_RENDER_POSTGRES_ID: dpg-d9n21fnlk1mc73djm8q0-a
          STAGING_RENDER_API_KEY: ${{ secrets.STAGING_RENDER_API_KEY }}
          STAGING_DATABASE_EXPECTED_USER: ${{ vars.STAGING_DATABASE_EXPECTED_USER }}
          MANAGED_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          RACUN_DEPLOY_ENV: staging
          STORAGE_MODE: r2
          R2_REGION: auto
          R2_ENDPOINT: ${{ secrets.STAGING_R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.STAGING_R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.STAGING_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.STAGING_R2_SECRET_ACCESS_KEY }}
          METADATA_RECEIPT_PATH: ${{ runner.temp }}/normal-representative-metadata/metadata-receipt.json
        run: node scripts/acquire-normal-representative-metadata.mjs

      - name: Always re-close and prove empty staging DB allow-list
        id: metadata_cleanup
        if: always() && steps.metadata_acquisition.outcome != 'skipped'
        working-directory: control
        env:
          STAGING_RENDER_POSTGRES_ID: dpg-d9n21fnlk1mc73djm8q0-a
          STAGING_RENDER_API_KEY: ${{ secrets.STAGING_RENDER_API_KEY }}
          RECEIPT_DIR: ${{ runner.temp }}/normal-representative-metadata
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RECEIPT_DIR"
          node scripts/managed-staging-db-tls-window.mjs close > "$RECEIPT_DIR/secondary-cleanup.json"

      - name: Verify immutable secret-free receipt bundle
        if: steps.metadata_acquisition.outcome == 'success' && steps.metadata_cleanup.outcome == 'success'
        working-directory: control
        run: node scripts/verify-normal-representative-metadata-receipt.mjs "${{ runner.temp }}/normal-representative-metadata"

      - name: Upload append-only metadata receipts
        if: always() && steps.metadata_acquisition.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: normal-representative-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/normal-representative-metadata
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  exact-sha-mobile-evidence:
    # Secret-bearing execution is only available from protected default main.
    # PR-controlled code cannot reach this job or its staging Environment.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode == 'full-e2e'
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REVIEWED_APP_SHA: acf1fd49fadc3387c3ae6a13f711689f1e0d9397
      REVIEWED_RUNNER_SHA: 9ba6330e394900c6c818be2021dcb8cc5a1b6d7b
    steps:
      - name: Checkout immutable default-branch control code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 0
          persist-credentials: false

      - name: Validate hard-bound reviewed SHA and immutable control checkout
        working-directory: control
        env:
          REQUESTED_SHA: ${{ inputs.reviewed_sha }}
          CONTROL_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$REQUESTED_SHA" = "$REVIEWED_APP_SHA"
          test "$(git rev-parse HEAD)" = "$CONTROL_SHA"

      - name: Verify public staging app identity and safety before secrets
        working-directory: control
        env:
          EXPECTED_APP_SHA: ${{ env.REVIEWED_APP_SHA }}
        run: node scripts/verify-staging-app-health.mjs

      - name: Validate staging database secret contract before evidence work
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_DATABASE_EXPECTED_USER: ${{ vars.STAGING_DATABASE_EXPECTED_USER }}
        run: node control/scripts/validate-staging-database-secret-contract.mjs

      - name: Set up pinned Node runtime for trusted control
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: control/package-lock.json

      - name: Install locked trusted control dependencies without lifecycle scripts
        working-directory: control
        run: npm ci --ignore-scripts

      - name: Detached checkout of exact reviewed evidence runner
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.REVIEWED_RUNNER_SHA }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Prove detached exact commit and clean tree
        working-directory: source
        run: |
          set -euo pipefail
          git checkout --detach "$REVIEWED_RUNNER_SHA"
          test "$(git rev-parse HEAD)" = "$REVIEWED_RUNNER_SHA"
          test "$(git cat-file -t "$REVIEWED_RUNNER_SHA")" = commit
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Build immutable exact-source evidence image
        working-directory: source
        env:
          EXPECTED_EVIDENCE_RUNNER_SHA: ${{ env.REVIEWED_RUNNER_SHA }}
          EVIDENCE_IMAGE_TAG: managed-mobile-evidence:${{ env.REVIEWED_RUNNER_SHA }}
        run: EVIDENCE_BUILD_OUTPUT_FILE="$GITHUB_ENV" bash ../control/scripts/build-mobile-evidence-image.sh

      - name: Independently verify OCI revision and tree labels
        working-directory: source
        run: |
          set -euo pipefail
          expected_tree="$(git rev-parse 'HEAD^{tree}')"
          test "$EVIDENCE_SOURCE_SHA" = "$REVIEWED_RUNNER_SHA"
          test "$EVIDENCE_SOURCE_TREE" = "$expected_tree"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$EVIDENCE_IMAGE_DIGEST")" = "$REVIEWED_RUNNER_SHA"
          test "$(docker image inspect --format '{{index .Config.Labels "ai.hdrv.source.tree"}}' "$EVIDENCE_IMAGE_DIGEST")" = "$expected_tree"

      - name: Preflight staging R2 write-read-delete round trip
        env:
          RACUN_DEPLOY_ENV: staging
          STORAGE_MODE: r2
          R2_REGION: auto
          R2_ENDPOINT: ${{ secrets.STAGING_R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.STAGING_R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.STAGING_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.STAGING_R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --entrypoint node \
            --env RACUN_DEPLOY_ENV \
            --env STORAGE_MODE \
            --env R2_REGION \
            --env R2_ENDPOINT \
            --env R2_BUCKET \
            --env R2_ACCESS_KEY_ID \
            --env R2_SECRET_ACCESS_KEY \
            --mount "type=bind,src=$GITHUB_WORKSPACE/control/scripts/preflight-staging-r2.mjs,dst=/srv/evidence/scripts/preflight-staging-r2.mjs,readonly" \
            "$EVIDENCE_IMAGE_DIGEST" \
            /srv/evidence/scripts/preflight-staging-r2.mjs

      - name: Run provider-free evidence inside temporary staging database TLS window
        id: staging_db_tls_window
        env:
          STAGING_RENDER_POSTGRES_ID: dpg-d9n21fnlk1mc73djm8q0-a
          STAGING_RENDER_API_KEY: ${{ secrets.STAGING_RENDER_API_KEY }}
          STAGING_DATABASE_EXPECTED_USER: ${{ vars.STAGING_DATABASE_EXPECTED_USER }}
          MANAGED_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          EXPECTED_APP_SHA: ${{ env.REVIEWED_APP_SHA }}
          EXPECTED_EVIDENCE_RUNNER_SHA: ${{ env.REVIEWED_RUNNER_SHA }}
          EVIDENCE_INHERIT_STAGING_ENV: "1"
          EVIDENCE_RECEIPT_EXPORT_DIR: ${{ runner.temp }}/managed-mobile-receipts
          BASE: https://racun-ai-staging-web.onrender.com
          RACUN_DEPLOY_ENV: staging
          RACUN_DB_RUNTIME: postgres
          STORAGE_MODE: r2
          R2_REGION: auto
          AUTH_SECRET: ${{ secrets.STAGING_AUTH_SECRET }}
          R2_ENDPOINT: ${{ secrets.STAGING_R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.STAGING_R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.STAGING_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.STAGING_R2_SECRET_ACCESS_KEY }}
        run: node control/scripts/managed-staging-db-tls-window.mjs run

      - name: Always close temporary staging database TLS window
        id: staging_db_tls_cleanup
        if: always() && steps.staging_db_tls_window.outcome != 'skipped'
        env:
          STAGING_RENDER_POSTGRES_ID: dpg-d9n21fnlk1mc73djm8q0-a
          STAGING_RENDER_API_KEY: ${{ secrets.STAGING_RENDER_API_KEY }}
        run: node control/scripts/managed-staging-db-tls-window.mjs close

      - name: Upload sanitized immutable receipt bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: managed-mobile-${{ env.REVIEWED_APP_SHA }}-runner-${{ env.REVIEWED_RUNNER_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/managed-mobile-receipts
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
