name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      # Mirrors Dockerfile.worker's runtime media/QC contract exactly (same
      # opencv-python-headless pin) — several tests exercise the real
      # ffmpeg/tesseract/OpenCV QC checks, not mocks.
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg python3 python3-pil python3-pip tesseract-ocr tesseract-ocr-eng
          python3 -m pip install --no-cache-dir --break-system-packages opencv-python-headless==4.10.0.84
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
