name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Matches Dockerfile.worker's runtime env exactly. Some tests fall back
      # to a hardcoded macOS Homebrew path when this is unset.
      FFMPEG_PATH: /usr/bin/ffmpeg
      FFPROBE_PATH: /usr/bin/ffprobe
      # Bukan rahasia: nilai buangan supaya `next build` bisa mengumpulkan
      # data halaman. Tanpa ini CI runner bersih SELALU gagal di build,
      # sementara build lokal hijau karena .env.local diam-diam mengisinya —
      # jadi "build hijau" di laptop tidak pernah berarti build hijau di CI.
      AUTH_SECRET: ci-build-only-not-a-secret-0000000000000000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      # Mirrors Dockerfile.worker's runtime media/QC contract exactly (same
      # opencv-python-headless pin) — several tests exercise the real
      # ffmpeg/tesseract/OpenCV QC checks, not mocks.
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg python3 python3-pil python3-pip tesseract-ocr tesseract-ocr-eng
          python3 -m pip install --no-cache-dir --break-system-packages opencv-python-headless==4.10.0.84
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      # SMOKE INTERAKSI (P0-QA-01) — apakah halaman HIDUP, bukan cuma
      # ter-render. Kelas bug yang dijaga benar-benar terjadi 19 Agu: CSP
      # mematikan hidrasi total dan TIDAK ADA tes yang menyadarinya, karena
      # semua tes menilai HTML/unit, bukan interaksi.
      #
      # Jalan di server DEV, bukan production start: mode production menolak
      # SQLite tanpa syarat (fail-closed yang benar), dan CI tidak punya
      # Postgres. Konsekuensi jujurnya: smoke ini membuktikan hidrasi dan
      # interaksi, TIDAK membuktikan CSP production — string CSP production
      # (tanpa unsafe-eval) dijaga tes unit tests/csp-produksi.test.ts.
      - run: npx playwright install --with-deps chromium
      - run: |
          PORT=3210 SCRIPT_LLM=0 npm run dev -- --port 3210 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3210/api/health >/dev/null && break
            sleep 1
          done
          BASE=http://localhost:3210 node scripts/smoke-interaksi.mjs

  # IMAGE WORKER — dibangun sungguhan, bukan cuma di-grep.
  #
  # Sampai 19 Agu CI tidak pernah membangun Dockerfile.worker sama sekali, dan
  # itu bukan celah teoretis: knowledge/ tidak ikut ter-COPY ke image padahal
  # worker menjalankan planShots, yang memuat kontrak kamera 14 mode dari
  # knowledge/rules/modes.md. Tabel kosong TIDAK melempar — prompt cuma keluar
  # tanpa kontrak kamera, diam-diam, hanya di produksi.
  #
  # Tes unit hanya bisa memeriksa teks Dockerfile-nya. Job ini memeriksa
  # ARTEFAKNYA: build image, lalu di dalam container muat modulnya sungguhan
  # dan tuntut 14 mode terbaca dari WORKDIR.
  worker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test-worker-container.sh

  # AUDIT UTANG KATALOG — pengukur, BUKAN gerbang deploy.
  #
  # Dinamai ulang dari "gerbang rilis keras" (audit ulang 18 Agu, RELEASE-01):
  # job ini merah sejak dibuat dan deploy tetap berjalan — dan alarm yang
  # selalu merah tapi selalu boleh dilewati bukan gate, itu papan utang.
  # Menyebutnya gate sambil melewatinya tiap deploy mengajari semua orang
  # bahwa kata "gate" di repo ini boleh diabaikan.
  #
  # Yang SEBENARNYA menjaga produk dari utang ini sudah jalan di runtime:
  # naskah cadangan yang gagal gate ditandai degraded dan DITOLAK dirender
  # (bukan dikirim diam-diam), dan galeri template menandai 29 template yang
  # copy cadangannya belum siap (KATALOG_BUTUH_COPY, dijaga tes agar tidak
  # basi). Job ini tinggal mengukur sisanya: angkanya harus TURUN setiap kali
  # copy ditulis ulang, dan tes script-catalog-audit menjaga tidak ada JENIS
  # kegagalan baru menyusup di balik utang lama.
  #
  # Suara copy tetap milik Brian/copywriter (keputusan 18 Agu, opsi a) —
  # merahnya tidak boleh dinormalkan lewat rewrite mekanis.
  catalog-debt-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run audit:script-catalog
