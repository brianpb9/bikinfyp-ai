# BikinFYP — reverse proxy ke container web (127.0.0.1:3000).
#
# Container TIDAK PERNAH membuka port ke publik (lihat docker-compose.server.yml:
# "127.0.0.1:3000:3000"), jadi tidak ada jalan masuk yang melewati TLS.

# Connection: upgrade HANYA untuk websocket.
#
# Versi pertama mengirim "Connection: upgrade" pada SETIAP request, dan Next
# menutup koneksinya — nginx menjawab 502 padahal aplikasinya sehat. Map ini
# mengirim "upgrade" hanya saat klien memang meminta upgrade, dan "close"
# untuk sisanya.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name bikinfyp.com www.bikinfyp.com;

    # Tantangan Let's Encrypt HTTP-01 dibiarkan lewat tanpa redirect — tanpa
    # ini perpanjangan sertifikat akan gagal diam-diam saat TLS sudah aktif.
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 300s;
        # Unggahan foto produk bisa besar; bawaan nginx 1 MB terlalu kecil.
        client_max_body_size 64m;
    }
}
