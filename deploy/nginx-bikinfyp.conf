# bikinfyp.com — DIPENSIUNKAN 5 Sep 2026 atas keputusan Brian.
#
# Domain ini TIDAK lagi melayani aplikasi. Semuanya dialihkan ke aiugc.id,
# dengan SATU pengecualian yang disengaja (lihat blok HTTPS di bawah).
#
# Domainnya tetap dijawab, bukan dimatikan. Mematikannya berarti tautan video
# bertanda tangan yang sudah TERKIRIM di email menjadi halaman mati — pembeli
# menerima kekosongan untuk video yang sudah dibayar. Pengalihan menjaga
# tautan itu tetap hidup: tanda tangannya dihitung dari PATH, bukan dari nama
# domain, dan $request_uri membawa path beserta query-nya utuh ke aiugc.id.
#
# Sertifikat dan tantangan ACME tetap dipertahankan supaya pengalihan ini
# tidak mati sendiri tiga bulan lagi saat sertifikatnya kedaluwarsa.

# Connection: upgrade HANYA untuk websocket.
#
# Versi pertama mengirimkannya pada SETIAP request dan Next menutup koneksi —
# nginx menjawab 502 padahal aplikasinya sehat.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---- HTTP: hanya untuk tantangan ACME dan mengantar ke HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name bikinfyp.com www.bikinfyp.com;

    # Dibiarkan lewat TANPA redirect. Kalau ikut dialihkan ke HTTPS,
    # perpanjangan sertifikat gagal diam-diam tiga bulan lagi.
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / { return 301 https://aiugc.id$request_uri; }
}

# ---- www -> apex. Satu host kanonik; APP_BASE_URL juga apex. ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.bikinfyp.com;

    ssl_certificate     /etc/letsencrypt/live/bikinfyp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bikinfyp.com/privkey.pem;
    # Setelan TLS ditulis eksplisit, bukan lewat include bawaan certbot:
    # /etc/letsencrypt/options-ssl-nginx.conf hanya ada bila plugin nginx
    # certbot terpasang, dan di server ini tidak. Include yang hilang membuat
    # nginx MENOLAK START — bukan cuma melewatkan setelan.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    return 301 https://aiugc.id$request_uri;
}

# ---- HTTPS: yang sebenarnya melayani ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bikinfyp.com;

    ssl_certificate     /etc/letsencrypt/live/bikinfyp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bikinfyp.com/privkey.pem;
    # Setelan TLS ditulis eksplisit, bukan lewat include bawaan certbot:
    # /etc/letsencrypt/options-ssl-nginx.conf hanya ada bila plugin nginx
    # certbot terpasang, dan di server ini tidak. Include yang hilang membuat
    # nginx MENOLAK START — bukan cuma melewatkan setelan.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS SENGAJA BELUM DIPASANG. Selama rollback ke Render masih mungkin,
    # header itu mengunci browser ke HTTPS selama berbulan-bulan dan menyulitkan
    # pemulihan. Pasang setelah cutover terbukti stabil.

    location /.well-known/acme-challenge/ { root /var/www/html; }

    # SATU-SATUNYA yang masih diproksi: callback server-ke-server.
    #
    # Duitku mengirimkannya lewat POST, dan alamat callback sudah ikut terkirim
    # pada transaksi yang dibuat SEBELUM pindah domain — alamat itu tidak bisa
    # ditarik kembali. POST tidak mengikuti 301: sebagian klien berhenti, dan
    # yang mengikuti mengubahnya jadi GET tanpa isi. Dua-duanya berarti
    # pembayaran yang sudah dibayar tidak pernah tercatat.
    location /api/webhooks/ {
        proxy_pass http://bikinfyp_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Sisanya pindah. $request_uri membawa path DAN query — tanda tangan pada
    # tautan video ikut utuh, jadi tautan lama tetap bisa dibuka.
    location / { return 301 https://aiugc.id$request_uri; }
}
