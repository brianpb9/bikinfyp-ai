# BikinFYP — reverse proxy ke container web (127.0.0.1:3000).
#
# Container TIDAK PERNAH membuka port ke publik (docker-compose.server.yml:
# "127.0.0.1:3000:3000"), jadi tidak ada jalan masuk yang melewati TLS.

# Connection: upgrade HANYA untuk websocket.
#
# Versi pertama mengirimkannya pada SETIAP request dan Next menutup koneksi —
# nginx menjawab 502 padahal aplikasinya sehat.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---- HTTP: hanya untuk tantangan ACME dan mengantar ke HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name bikinfyp.com www.bikinfyp.com;

    # Dibiarkan lewat TANPA redirect. Kalau ikut dialihkan ke HTTPS,
    # perpanjangan sertifikat gagal diam-diam tiga bulan lagi.
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / { return 301 https://bikinfyp.com$request_uri; }
}

# ---- www -> apex. Satu host kanonik; APP_BASE_URL juga apex. ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.bikinfyp.com;

    ssl_certificate     /etc/letsencrypt/live/bikinfyp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bikinfyp.com/privkey.pem;
    # Setelan TLS ditulis eksplisit, bukan lewat include bawaan certbot:
    # /etc/letsencrypt/options-ssl-nginx.conf hanya ada bila plugin nginx
    # certbot terpasang, dan di server ini tidak. Include yang hilang membuat
    # nginx MENOLAK START — bukan cuma melewatkan setelan.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    return 301 https://bikinfyp.com$request_uri;
}

# ---- HTTPS: yang sebenarnya melayani ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bikinfyp.com;

    ssl_certificate     /etc/letsencrypt/live/bikinfyp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bikinfyp.com/privkey.pem;
    # Setelan TLS ditulis eksplisit, bukan lewat include bawaan certbot:
    # /etc/letsencrypt/options-ssl-nginx.conf hanya ada bila plugin nginx
    # certbot terpasang, dan di server ini tidak. Include yang hilang membuat
    # nginx MENOLAK START — bukan cuma melewatkan setelan.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS SENGAJA BELUM DIPASANG. Selama rollback ke Render masih mungkin,
    # header itu mengunci browser ke HTTPS selama berbulan-bulan dan menyulitkan
    # pemulihan. Pasang setelah cutover terbukti stabil.

    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / {
        proxy_pass http://bikinfyp_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 300s;
        # Unggahan foto produk bisa besar; bawaan nginx 1 MB terlalu kecil.
        client_max_body_size 64m;
    }
}
