# brand.aiugc.id — dashboard enterprise, hostname terpisah dari retail.
#
# KENAPA BLOK SENDIRI, BUKAN MENUMPANG server_name aiugc.id:
# middleware.ts menyalakan rewrite /* -> /dashboard/* HANYA ketika header Host
# sama persis dengan DASHBOARD_HOSTNAME. Menumpang server_name membuat Host
# tetap aiugc.id dan dashboard tidak pernah muncul — pelajaran yang sudah
# dibayar 5 Sep, saat aiugc.id menumpang blok :80 milik bikinfyp dan setiap
# pengunjung dilempar ke domain lama.
#
# SERTIFIKATNYA MILIK aiugc.id, dan itu disengaja: sambungan ke sini datang
# dari cloudflared di mesin yang sama, yang membuka TLS dengan SNI aiugc.id
# (originServerName). Nama di sertifikat diperiksa terhadap SNI itu, bukan
# terhadap Host. Blok ini yang memilihkan rute berdasarkan Host-nya.

server {
    listen 80;
    listen [::]:80;
    server_name brand.aiugc.id www.brand.aiugc.id;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://brand.aiugc.id$request_uri; }
}

# www SATU ARAH ke apex brand — satu host kanonik, sama seperti aiugc.id.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.brand.aiugc.id;
    ssl_certificate     /etc/letsencrypt/live/aiugc.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aiugc.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    return 301 https://brand.aiugc.id$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name brand.aiugc.id;

    ssl_certificate     /etc/letsencrypt/live/aiugc.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aiugc.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / {
        proxy_pass http://bikinfyp_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 300s;
        client_max_body_size 64m;
    }
}
