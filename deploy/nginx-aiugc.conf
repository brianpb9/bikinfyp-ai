# AIUGC.ID — domain utama sejak 5 Sep 2026.
#
# Blok ini SALINAN struktur dari sites-available/bikinfyp dengan sertifikat dan
# server_name yang berbeda; keduanya menembak upstream yang sama
# (conf.d/bikinfyp-upstream.conf), jadi pergantian warna blue/green tetap
# melayani kedua domain sekaligus.
#
# Domain lama SENGAJA tetap hidup, bukan dialihkan: tautan video bertanda
# tangan, callback Duitku, dan redirect Google OAuth yang sudah terdaftar masih
# menunjuk ke sana. Mematikannya sekarang memutus semuanya sekaligus.
# ---- HTTP: tantangan ACME + antar ke HTTPS milik DOMAIN INI SENDIRI ----
#
# Blok ini ADA karena ketiadaannya sempat merusak: aiugc.id dulu menumpang
# server_name di blok :80 milik bikinfyp, dan blok itu mengantar ke
# https://bikinfyp.com secara hardcode. Akibatnya setiap orang yang mengetik
# "aiugc.id" di address bar — yang selalu mulai dari http:// — dilempar ke
# domain lama, dengan 301 PERMANEN yang ikut mengendap di cache browsernya.
#
# Aturannya: satu domain mengantar ke dirinya sendiri. Jangan pernah menumpang
# server_name di blok yang tujuan redirect-nya milik domain lain.
server {
    listen 80;
    listen [::]:80;
    server_name aiugc.id www.aiugc.id;

    # Dibiarkan lewat TANPA redirect. Kalau ikut dialihkan ke HTTPS,
    # perpanjangan sertifikat gagal diam-diam tiga bulan lagi.
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / { return 301 https://aiugc.id$request_uri; }
}

# www SATU ARAH ke apex, meniru perlakuan www.bikinfyp.com.
#
# Bukan kosmetik: redirect_uri Google didaftarkan per-host apa adanya, jadi
# melayani www DAN apex berarti dua URI yang harus didaftarkan dan dijaga
# selamanya. Satu host kanonik = satu URI.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.aiugc.id;
    ssl_certificate     /etc/letsencrypt/live/aiugc.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aiugc.id/privkey.pem;
    return 301 https://aiugc.id$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name aiugc.id;

    ssl_certificate     /etc/letsencrypt/live/aiugc.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aiugc.id/privkey.pem;
    # Setelan TLS ditulis eksplisit, bukan lewat include bawaan certbot:
    # /etc/letsencrypt/options-ssl-nginx.conf hanya ada bila plugin nginx
    # certbot terpasang, dan di server ini tidak. Include yang hilang membuat
    # nginx MENOLAK START — bukan cuma melewatkan setelan.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS SENGAJA BELUM DIPASANG. Selama rollback ke Render masih mungkin,
    # header itu mengunci browser ke HTTPS selama berbulan-bulan dan menyulitkan
    # pemulihan. Pasang setelah cutover terbukti stabil.

    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / {
        proxy_pass http://bikinfyp_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 300s;
        # Unggahan foto produk bisa besar; bawaan nginx 1 MB terlalu kecil.
        client_max_body_size 64m;
    }
}

# ---------------------------------------------------------------------------
# CATATAN OPERASIONAL — aiugc.id ADA DI BELAKANG PROXY CLOUDFLARE.
#
# Ditemukan 5 Sep 2026, dan tidak terlihat dari berkas ini: aiugc.id memakai
# nameserver Cloudflare dan A record-nya diproksi (publik melihat 172.67.x /
# 104.21.x, bukan 187.77.148.89). bikinfyp.com TIDAK — ia langsung ke origin.
# Jadi dua domain yang dilayani blok-blok di sini TIDAK setara jalurnya.
#
# Yang sudah diperiksa dan aman:
#   - IP asli pengunjung tetap sampai: Cloudflare mengisi X-Forwarded-For
#     dengan IP klien, nginx menambahkan miliknya di belakang, dan aplikasi
#     mengambil elemen PERTAMA. Rate limit tetap mengenai orangnya.
#   - Video berbayar tidak mengendap di tepi Cloudflare: /api/files mengirim
#     "cache-control: private", dan cache bersama menghormatinya.
#     cf-cache-status terbaca DYNAMIC/BYPASS, bukan HIT.
#
# Yang perlu diingat saat mendiagnosis nanti:
#   - Galat 5xx berkode 52x datang dari Cloudflare, BUKAN dari nginx. Jangan
#     mencarinya di log ini. 522 = Cloudflare gagal menjangkau origin.
#   - Origin masih bisa dihubungi langsung lewat IP; untuk memisahkan masalah
#     Cloudflare dari masalah kita, pakai:
#       curl -skI --resolve aiugc.id:443:187.77.148.89 https://aiugc.id/...
