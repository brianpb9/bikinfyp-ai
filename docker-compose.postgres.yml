services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-racun}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-racun_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-racun_local}
    ports:
      - "${POSTGRES_PORT:-54329}:5432"
    volumes:
      - racun-postgres-local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  racun-postgres-local:
