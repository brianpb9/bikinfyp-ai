# Staging-only Render Blueprint. It deliberately has no production resources.
# Resource names are also the cross-service wiring contract below.

services:
  - type: web
    name: racun-ai-staging-web
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: Dockerfile.web
    dockerContext: .
    healthCheckPath: /api/health
    preDeployCommand: node scripts/migrate-postgres-runtime.mjs
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: RACUN_DEPLOY_ENV
        value: staging
      - key: RACUN_DB_RUNTIME
        value: postgres
      - key: RACUN_QUEUE_MODE
        value: redis
      - key: REDIS_QUEUE_NAME
        value: racun-jobs-staging
      - key: DATABASE_URL
        fromDatabase:
          name: racun-ai-staging-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: racun-ai-staging-kv
          property: connectionString
      - key: STORAGE_MODE
        value: r2
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET
        value: bikinfyp-staging
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_REGION
        value: auto
      - key: AUTH_SECRET
        generateValue: true
      # Temporary staging-only test identity. Never carry this to production.
      - key: ALLOW_DEV_LOGIN
        value: "1"
      - key: JOB_INTAKE_MODE
        value: open
      # Founder-bound staging reference intake. Never copy these bindings to production.
      - key: C5_AUTHORIZED_HUMAN_REVIEW_ROLE
        value: Founder/CEO
      - key: C5_AUTHORIZED_HUMAN_REVIEW_PRINCIPAL_ID
        value: ac8b0a3e-8835-4e64-80e6-2e2cae6198b8
      - key: STAGING_INTERNAL_REFERENCE_INGESTION
        value: "1"
      - key: STAGING_INTERNAL_REFERENCE_SERVICE_ID
        value: srv-d9n28tijnfac73a87lt0
      - key: PROVIDER_VIDEO
        value: byteplus
      - key: PROVIDER_VOICE
        value: mock
      - key: BYTEPLUS_ARK_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: MIDTRANS_IS_PRODUCTION
        value: "false"
      - key: APP_BASE_URL
        value: https://racun-ai-staging-web.onrender.com
      - key: MIDTRANS_SERVER_KEY
        sync: false
      - key: MIDTRANS_CLIENT_KEY
        sync: false
      # Duitku sandbox — jalur uji integrasi sebelum cutover produksi.
      - key: PAYMENT_GATEWAY
        value: duitku
      - key: DUITKU_MERCHANT_CODE
        sync: false
      - key: DUITKU_API_KEY
        sync: false
      - key: DUITKU_IS_PRODUCTION
        value: "false"
      - key: SUPPORT_WHATSAPP
        value: "628170261628"

  - type: worker
    name: racun-ai-staging-worker
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: Dockerfile.worker
    dockerContext: .
    autoDeployTrigger: off
    maxShutdownDelaySeconds: 300
    envVars:
      - key: NODE_ENV
        value: production
      - key: RACUN_DEPLOY_ENV
        value: staging
      - key: RACUN_DB_RUNTIME
        value: postgres
      - key: RACUN_QUEUE_MODE
        value: redis
      - key: REDIS_QUEUE_NAME
        value: racun-jobs-staging
      - key: WORKER_CONCURRENCY
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: racun-ai-staging-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: racun-ai-staging-kv
          property: connectionString
      - key: STORAGE_MODE
        value: r2
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET
        value: bikinfyp-staging
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_REGION
        value: auto
      - key: AUTH_SECRET
        fromService:
          type: web
          name: racun-ai-staging-web
          envVarKey: AUTH_SECRET
      - key: PROVIDER_VIDEO
        value: byteplus
      - key: PROVIDER_VOICE
        value: mock
      - key: BYTEPLUS_ARK_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: MIDTRANS_IS_PRODUCTION
        value: "false"
      - key: MIDTRANS_SERVER_KEY
        sync: false
      - key: MIDTRANS_CLIENT_KEY
        sync: false

  - type: keyvalue
    name: racun-ai-staging-kv
    plan: free
    region: singapore
    maxmemoryPolicy: noeviction
    persistenceMode: off
    # Queue only accepts Render private-network traffic.
    ipAllowList: []

databases:
  - name: racun-ai-staging-postgres
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    databaseName: racun_staging
    user: racun_staging
    connectionPool: none
