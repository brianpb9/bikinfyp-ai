<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Sedang offline — AIUGC.ID</title>
<style>
  body{margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;
       font-family:system-ui,-apple-system,sans-serif;background:#fbfcf6;color:#18181b;padding:24px}
  .k{max-width:340px;text-align:center}
  h1{font-size:19px;margin:0 0 8px}
  p{font-size:14px;line-height:1.6;color:#52525b;margin:0 0 18px}
  button{min-height:48px;padding:0 22px;border:0;border-radius:14px;background:#18181b;color:#fff;
         font-size:15px;font-weight:700}
</style>
</head>
<body>
  <div class="k">
    <img src="/icons/icon-192.png" alt="" width="64" height="64" style="border-radius:16px"/>
    <h1>Kamu sedang offline</h1>
    <!-- Menyebut apa yang AMAN, bukan cuma "tidak ada koneksi": orang yang
         videonya sedang diproses akan panik mengira prosesnya ikut berhenti. -->
    <p>Video yang sedang diproses tetap jalan di server kami — tidak ada yang hilang.
       Sambungkan internet lagi, lalu buka ulang.</p>
    <button onclick="location.reload()">Coba lagi</button>
  </div>
</body>
</html>
