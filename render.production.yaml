# Production-only Render Blueprint — use this file explicitly, never rename or
# sync the staging Blueprint. It creates isolated resources in Singapore.
# Secrets remain sync:false and must be entered in Render, not committed here.

services:
  - type: web
    name: bikinfyp-ai-production-web
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    # Migrations are deliberately run as a one-off command from the Render
    # Shell, never implicitly on every deploy. See the provisioning runbook.
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: RACUN_DEPLOY_ENV
        value: production
      - key: RACUN_DB_RUNTIME
        value: postgres
      - key: RACUN_QUEUE_MODE
        value: redis
      - key: REDIS_QUEUE_NAME
        value: bikinfyp-ai-jobs-production
      - key: DATABASE_URL
        fromDatabase:
          name: bikinfyp-ai-production-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: bikinfyp-ai-production-kv
          property: connectionString
      - key: STORAGE_MODE
        value: r2
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET
        value: bikinfyp-production
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_REGION
        value: auto
      - key: AUTH_SECRET
        generateValue: true
      - key: ALLOW_DEV_LOGIN
        value: "0"
      - key: JOB_INTAKE_MODE
        value: closed
      - key: PROVIDER_VIDEO
        value: byteplus
      - key: BYTEPLUS_ARK_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: OPERATIONAL_MONITORING_ENABLED
        value: "true"
      - key: OPERATIONAL_ALERT_TO_EMAIL
        sync: false
      - key: OPERATIONAL_MONITORING_INTERVAL_MIN
        value: "5"
      - key: OPERATIONAL_ALERT_COOLDOWN_MIN
        value: "60"
      - key: OPERATIONAL_ERROR_WINDOW_MIN
        value: "60"
      - key: OPERATIONAL_ERROR_MIN_JOBS
        value: "3"
      - key: OPERATIONAL_ERROR_RATE_PERCENT
        value: "20"
      # Domain publik asli — BUKAN hostname onrender.com. Callback/return URL
      # Duitku & Midtrans diturunkan ketat dari nilai ini (lib/duitku.ts,
      # lib/midtrans.ts); hostname yang salah = webhook terdaftar ke host yang
      # salah dan kredit tidak pernah masuk.
      - key: APP_BASE_URL
        value: https://bikinfyp.com
      # Gateway aktif (keputusan pindah ke Duitku, 2026-08-19).
      - key: PAYMENT_GATEWAY
        value: duitku
      # Kredensial dari dashboard Duitku (Proyek). Sandbox dulu untuk tinjauan
      # onboarding Duitku; naikkan DUITKU_IS_PRODUCTION setelah approval.
      - key: DUITKU_MERCHANT_CODE
        sync: false
      - key: DUITKU_API_KEY
        sync: false
      - key: DUITKU_IS_PRODUCTION
        value: "false"
      - key: MIDTRANS_IS_PRODUCTION
        value: "false"
      # Kontak dukungan di halaman Bantuan — tanpa ini tombol WhatsApp tersembunyi.
      - key: SUPPORT_WHATSAPP
        value: "628170261628"

  - type: worker
    name: bikinfyp-ai-production-worker
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: Dockerfile.worker
    dockerContext: .
    autoDeployTrigger: off
    maxShutdownDelaySeconds: 300
    envVars:
      - key: NODE_ENV
        value: production
      - key: RACUN_DEPLOY_ENV
        value: production
      - key: RACUN_DB_RUNTIME
        value: postgres
      - key: RACUN_QUEUE_MODE
        value: redis
      - key: REDIS_QUEUE_NAME
        value: bikinfyp-ai-jobs-production
      - key: WORKER_CONCURRENCY
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: bikinfyp-ai-production-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: bikinfyp-ai-production-kv
          property: connectionString
      - key: STORAGE_MODE
        value: r2
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET
        value: bikinfyp-production
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_REGION
        value: auto
      - key: AUTH_SECRET
        fromService:
          type: web
          name: bikinfyp-ai-production-web
          envVarKey: AUTH_SECRET
      - key: PROVIDER_VIDEO
        value: byteplus
      - key: BYTEPLUS_ARK_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: OPERATIONAL_MONITORING_ENABLED
        value: "true"
      - key: OPERATIONAL_ALERT_TO_EMAIL
        sync: false
      - key: OPERATIONAL_MONITORING_INTERVAL_MIN
        value: "5"
      - key: OPERATIONAL_ALERT_COOLDOWN_MIN
        value: "60"
      - key: OPERATIONAL_ERROR_WINDOW_MIN
        value: "60"
      - key: OPERATIONAL_ERROR_MIN_JOBS
        value: "3"
      - key: OPERATIONAL_ERROR_RATE_PERCENT
        value: "20"
      - key: MIDTRANS_IS_PRODUCTION
        value: "false"

  - type: keyvalue
    name: bikinfyp-ai-production-kv
    plan: starter
    region: singapore
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot
    # No external Redis traffic; Render private network only.
    ipAllowList: []

databases:
  - name: bikinfyp-ai-production-postgres
    plan: basic-256mb
    region: singapore
    postgresMajorVersion: "16"
    databaseName: racun_production
    user: racun_production
    connectionPool: none
    # No external database traffic; Render private network only.
    ipAllowList: []
